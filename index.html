.lab-shot{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(5,3,8,.88);padding:16px}
.lsh-in{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:min(460px,92vw);text-align:center}
.lsh-in img{max-height:72vh;border-radius:10px;box-shadow:0 0 40px rgba(196,155,255,.35);user-select:auto;-webkit-user-select:auto;-webkit-touch-callout:default}
.lsh-in .hint{max-width:none;font-size:14px}
@media (max-width:819px){
  .lab{grid-template-columns:1fr}
  .lab-stand{position:sticky;top:54px;z-index:3;flex-direction:row;justify-content:center;gap:14px;padding:6px 0 10px;margin:0 -16px;background:linear-gradient(rgba(12,8,18,.94) 78%,rgba(12,8,18,0))}
  .ls-fig{width:min(40vw,170px)}
  .ls-tag{max-width:46vw}
  .lo-grid.g4{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .lo-l{font-size:13px}
  .ld-body{grid-template-columns:1fr}
  .ld-pic{width:min(70%,260px);justify-self:center}
  .ld-txt{padding-right:0}
}
@media (max-width:819px) and (max-height:600px){.lab-stand{position:relative;top:0}}
@media (max-height:520px){#mode.lab5 .m-kicker,#mode.lab5 .m-desc{display:none}}
@media (prefers-reduced-motion:reduce){.yk-bl,.yk-lk,.yk-float,.yk-hop,.yk-sit,.yk-breath,.yk-neck,.yk-tl,.yk-tg,.yk-hd,.yk-steam,.ls-glow{animation:none}}

/* ---------- stage 5B: 百鬼夜行 — the final night parade ---------- */
.book{touch-action:none;-webkit-touch-callout:none}
.book.charge{transition:box-shadow 3s linear,border-color 3s linear;border-color:rgba(196,155,255,.7);box-shadow:0 0 34px rgba(196,155,255,.5)}
#hkGate{cursor:pointer}
#hkGate .hg-in{opacity:0;pointer-events:none;transition:opacity 1.8s ease,filter .5s ease}
#scn.gate5 #hkGate .hg-in{pointer-events:auto}
#hkGate .hg-off{transition:opacity 1.6s ease,filter .4s ease}
#hkGate:hover .hg-off{filter:brightness(1.3)}
#scn.gate5 #hkGate .hg-off{opacity:0;pointer-events:none}
#hkGate .hg-glim{opacity:.12;animation:hgGlim 6s ease-in-out infinite}
@keyframes hgGlim{0%,100%{opacity:.08}50%{opacity:.32}}
#hkGate .hg-eyes{opacity:0;animation:hgEyes 9s steps(1) infinite}
@keyframes hgEyes{0%,62%,70%,100%{opacity:0}63%,66%{opacity:.9}64%{opacity:0}}
#hkGate .hg-seal{transform-box:fill-box;transform-origin:50% 0;animation:sway 4s ease-in-out infinite}
#hkGate.shake .hg-off{animation:hgShake .45s ease}
@keyframes hgShake{20%{transform:translateX(-5px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
#scn.gate5 #hkGate .hg-in{opacity:1;animation:hgFlick 5.5s steps(1) 1.8s infinite}
#scn.gate5 #hkGate:hover .hg-in{filter:brightness(1.25)}
@keyframes hgFlick{0%,100%{opacity:1}41%{opacity:.55}42%{opacity:1}44%{opacity:.72}45%{opacity:1}}
#hkGate .hg-mist{animation:hgMist 3.4s ease-in-out infinite}
@keyframes hgMist{50%{opacity:.55;transform:translateY(-10px)}}

#hk{position:fixed;inset:0;z-index:50;overflow:hidden;--acc:var(--lantern);
  background:linear-gradient(180deg,#0c1236 0%,#1a1d4c 26%,#352a5e 44%,#6a3a58 56%,#a5543e 64%,#4a2a2c 74%,#160e14 100%);
  clip-path:circle(0 at var(--cx,50%) var(--cy,50%));user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#hk.open{animation:wipeIn 1.1s cubic-bezier(.6,0,.2,1) forwards}
#hk.closing{animation:wipeOut .6s cubic-bezier(.6,0,.4,1) forwards}
body.hk-on #rotate{display:none!important}
.hk-l{position:absolute;inset:0;pointer-events:none}
.hk-l>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hk-moon{position:absolute;left:4vw;top:3vh;width:min(54vh,42vw);aspect-ratio:1}
.hk-moon svg{width:100%;height:100%;display:block;overflow:visible}
.hk-bat{position:absolute;left:var(--x);top:var(--y);width:var(--s);opacity:0;animation:hkBat var(--d) linear var(--dl) infinite}
.hk-bat svg{display:block;width:100%;overflow:visible;animation:hkBob 1.7s ease-in-out infinite}
.hk-wing{transform-box:fill-box;transform-origin:50% 40%;animation:hkFlap .24s ease-in-out infinite alternate}
@keyframes hkFlap{to{transform:scaleY(-.4)}}
@keyframes hkBob{50%{transform:translateY(-40%)}}
@keyframes hkBat{0%{transform:translate(0,0) scale(.5);opacity:0}8%,86%{opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(1.25);opacity:0}}
.hk-cl{animation:hkDrift 34s ease-in-out infinite alternate}
@keyframes hkDrift{to{transform:translateX(48px)}}
.hk-sk{position:absolute;transform:translateY(66%)}
.hk-sk.up{animation:hkRise 7s cubic-bezier(.32,.08,.2,1) forwards}
@keyframes hkRise{from{transform:translateY(66%)}to{transform:translateY(0)}}
.hk-sk>svg{width:100%;height:100%;display:block;overflow:visible}
.hk-skb{transform-box:view-box;transform-origin:520px 900px;animation:hkLoom 11s ease-in-out infinite}
@keyframes hkLoom{0%,100%{transform:rotate(0)}50%{transform:rotate(-1.8deg)}}
.hk-jaw{transform-box:fill-box;transform-origin:92% 6%}
.hk-sk.clack .hk-jaw{animation:hkClack .8s ease-in-out}
@keyframes hkClack{0%,100%{transform:none}18%{transform:rotate(9deg)}30%{transform:rotate(-3deg)}50%{transform:rotate(7deg)}64%{transform:rotate(-3deg)}80%{transform:none}}
.hk-arm{transform-box:view-box;transform-origin:330px 410px}
.hk-sk.reach .hk-arm{animation:hkReach 6s ease-in-out}
@keyframes hkReach{0%,100%{transform:none}35%{transform:rotate(-8deg)}70%{transform:rotate(5deg)}}
.hk-ember{animation:hkEmber 5s ease-in-out infinite}
@keyframes hkEmber{0%,100%{opacity:.15}50%{opacity:.6}}
.hk-skull{pointer-events:auto;cursor:pointer}
.hk-h{position:absolute;bottom:0;height:100%;aspect-ratio:400/900}
.hk-h.l{left:min(0px,calc(34vw - 44.45vh))}
.hk-h.r{right:min(0px,calc(34vw - 44.45vh))}
.hk-h>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hk-ban{position:absolute;display:flex;flex-direction:column;align-items:center;padding:1.1vh 0 .8vh;border-radius:2px;background:#b5321e;pointer-events:auto;transform-origin:50% 0;animation:sway 6s ease-in-out infinite;
  box-shadow:inset 0 0 0 .45vh #b5321e,inset 0 0 0 .7vh #f1e3c3,0 1vh 2.4vh rgba(0,0,0,.55)}
.hk-ban.c{background:#efe1c0;box-shadow:inset 0 0 0 .45vh #efe1c0,inset 0 0 0 .7vh #b5321e,0 1vh 2.4vh rgba(0,0,0,.55);animation-delay:-3s}
.hk-ban::before{content:"";position:absolute;left:-14%;right:-14%;top:-1.3vh;height:1vh;border-radius:.5vh;background:#24160d}
.hk-bk{display:block;width:80%;padding:.2vh 0 .5vh;background:#f1e3c3;color:#1d130d;text-align:center;font-family:var(--f-display);font-size:5vh;line-height:1.5;border-radius:1px}
.hk-ban.c .hk-bk{background:#b5321e;color:#f6ead2}
.hk-bk rt{font-size:.34em}
.hk-ban svg{flex:1;width:74%;min-height:0;margin-top:.6vh}
.hk-bk .w:hover,.hk-bk .w.sel{color:#b5321e;text-shadow:none}
.hk-ban.c .hk-bk .w:hover,.hk-ban.c .hk-bk .w.sel{color:#ffd98c}

.hk-pro{position:absolute;inset:0;pointer-events:none}
.hk-p{position:absolute;left:0;bottom:0;pointer-events:auto;cursor:pointer;will-change:transform;-webkit-box-reflect:below 0 linear-gradient(transparent 58%,rgba(255,255,255,.2))}
.hk-p::after{content:"";position:absolute;left:12%;right:12%;bottom:-3%;height:8%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent);z-index:-1}
.hk-p:focus-visible{outline:2px solid var(--lantern-hot);outline-offset:4px;border-radius:12px}
.hk-f{width:100%;height:100%;transform-origin:50% 100%}
.hk-f>svg{width:100%;height:100%;display:block;overflow:visible}
.mv-walk .hk-f{animation:hkWalk 1.15s ease-in-out infinite}
.mv-hop .hk-f{animation:hkHop .8s cubic-bezier(.3,0,.4,1) infinite}
.mv-float .hk-f{animation:hkFloat 3.4s ease-in-out infinite}
.mv-dance .hk-f{animation:hkDance 1.3s ease-in-out infinite}
@keyframes hkWalk{0%,100%{transform:rotate(-2.5deg)}25%,75%{transform:translateY(-3.5%)}50%{transform:rotate(2.5deg)}}
@keyframes hkHop{0%,100%{transform:scale(1.06,.92)}18%,82%{transform:none}50%{transform:translateY(-16%) scale(.96,1.05)}}
@keyframes hkFloat{0%,100%{transform:translateY(-3%)}50%{transform:translateY(-10%)}}
@keyframes hkDance{0%,100%{transform:rotate(-8deg)}25%,75%{transform:translateY(-7%)}50%{transform:rotate(8deg)}}
.hk-p.talk .hk-f{animation:hkTalk .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes hkTalk{40%{transform:translateY(-10%) scale(1.06)}}
/* the shrine yokai (ART) come alive here the same way they do on a solved ema */
.hk-p .mk{display:none}
.hk-p .tl{transform:rotate(var(--a))}
.hk-p .tails{transform-box:fill-box;transform-origin:50% 100%;animation:tailSway 3.2s ease-in-out infinite}
.hk-p .kbf{animation:float 3.6s ease-in-out calc(var(--k) * -.9s) infinite}
.hk-p .eye2{transform-box:fill-box;transform-origin:center;animation:look 4s ease-in-out infinite}
.hk-p .ohead{transform-box:fill-box;transform-origin:50% 100%;animation:ohBob 3.6s ease-in-out infinite}
.hk-p .m-open,.hk-p .hah{opacity:0;animation:mOpen 3.6s steps(1) infinite}
.hk-p .m-shut{animation:mShut 3.6s steps(1) infinite}
.hk-p .club{animation:pound 3.6s ease-in infinite}
.hk-p .zb{transform-box:fill-box;transform-origin:50% 100%;animation:zHop 1.3s ease-in-out infinite}
.hk-p .armw{transform-box:fill-box;transform-origin:0 100%;animation:armWave .45s ease-in-out infinite alternate}
.hk-p .dust{opacity:0;transform-box:fill-box;transform-origin:center;animation:dust 1.3s ease-out infinite}
.hk-p .dust.b{animation-delay:.65s}
.hk-p .hair{transform-box:fill-box;transform-origin:50% 0;animation:hairSw 3s ease-in-out infinite}
.hk-p .sc path{animation:shim 2.4s ease-in-out infinite;animation-delay:calc(var(--r) * -.3s)}
.hk-p .ab{animation:bob 2.6s ease-in-out infinite}
.hk-p .wv{animation:wave 3s ease-in-out infinite}
.hk-p .fl{opacity:0;animation:snow 4s linear infinite;animation-delay:calc(var(--s) * -.37s)}
.hk-p .breath{opacity:0;transform-box:fill-box;transform-origin:0 50%;animation:breath 3.2s ease-out 1s infinite}
.hk-p .frost{animation:frost 3s ease-in-out infinite}
.hk-p .yb{animation:bob 4.2s ease-in-out infinite}
.hk-p .strand{transform-box:fill-box;transform-origin:0 0;animation:strand 2.4s ease-in-out infinite alternate}
.hk-p .kbody{transform-box:fill-box;transform-origin:50% 100%;animation:kHop .9s cubic-bezier(.3,0,.4,1) infinite}
.hk-p .tg{transform-box:fill-box;transform-origin:25% 0;animation:tWag .45s ease-in-out infinite alternate}
.hk-p .ksh{transform-box:fill-box;transform-origin:center;animation:kSh .9s cubic-bezier(.3,0,.4,1) infinite}
.hk-swing{transform-box:view-box;transform-origin:234px 30px;animation:hkSwing 1.15s ease-in-out infinite}
@keyframes hkSwing{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
.hk-neck{transform-box:view-box;transform-origin:84px 166px;animation:hkNeck 4.4s ease-in-out infinite}
@keyframes hkNeck{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(6deg)}}
.hk-tl1,.hk-tl2{transform-box:fill-box;transform-origin:0 100%;animation:ykTail 1.6s ease-in-out infinite}
.hk-tl2{animation-delay:-.8s}
.hk-arm1{transform-box:fill-box;transform-origin:95% 95%;animation:hkPaw .65s ease-in-out infinite alternate}
.hk-arm2{transform-box:fill-box;transform-origin:5% 90%;animation:hkPaw .65s ease-in-out -.32s infinite alternate}
@keyframes hkPaw{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.hk-tg2{transform-box:fill-box;transform-origin:40% 0;animation:tWag .5s ease-in-out infinite alternate}
.hk-plate{animation:hkPlate 2.6s ease-in-out infinite}
@keyframes hkPlate{0%,55%,100%{transform:none}28%{transform:translateY(-10px)}}

.hk-bub{position:absolute;z-index:6;left:0;top:0;width:max-content;max-width:min(380px,84vw);padding:6px 34px 10px 16px;border-radius:14px;pointer-events:auto;
  background:rgba(16,12,22,.95);border:1px solid rgba(255,190,120,.5);box-shadow:0 0 30px rgba(255,150,60,.22),0 12px 30px rgba(0,0,0,.6);animation:toastin .35s cubic-bezier(.2,1.4,.4,1)}
.hk-bub::after{content:"";position:absolute;left:var(--tx,50%);bottom:-8px;width:14px;height:14px;margin-left:-7px;background:#100c16;border:1px solid rgba(255,190,120,.5);border-width:0 1px 1px 0;transform:rotate(45deg)}
.hk-bub.up::after{bottom:auto;top:-8px;border-width:1px 0 0 1px}
.hk-bn{font-weight:700;font-size:13px;line-height:2;color:var(--onibi);letter-spacing:.04em}
.hk-bn rt{font-size:.5em}
.hk-bl{margin:0;font-family:var(--f-display);font-size:clamp(18px,2.3vw,23px);line-height:2.05;color:var(--paper)}
.hk-bub .g-tr{margin-top:2px}
.hk-bub .g-ru{margin-top:6px;font-size:14px;max-width:340px}
.hk-bx{position:absolute;right:6px;top:6px;width:26px;height:26px;border:0;border-radius:50%;background:none;color:var(--muted);font-size:19px;line-height:1;padding:0}
.hk-bx:hover{color:var(--paper)}

.hk-co{position:absolute;bottom:-1vh;height:min(34vh,46vw);aspect-ratio:320/300}
.hk-co.l{left:-1vw}.hk-co.r{right:-1vw;transform:scaleX(-1)}
.hk-mp{position:absolute;top:-3vh;height:min(30vh,34vw);aspect-ratio:340/220;transform-origin:0 0;animation:hkMp 7s ease-in-out infinite}
.hk-mp.l{left:-3vw}.hk-mp.r{right:-3vw;transform-origin:100% 0;animation-name:hkMpR}
@keyframes hkMp{0%,100%{transform:rotate(0)}50%{transform:rotate(2deg)}}
@keyframes hkMpR{0%,100%{transform:scaleX(-1) rotate(0)}50%{transform:scaleX(-1) rotate(2deg)}}
.hk-co svg,.hk-mp svg{display:block;width:100%;height:100%;overflow:visible}
.hk-leaf{position:absolute;top:-6vh;left:var(--x);width:var(--s);animation:hkFall var(--d) linear var(--dl) infinite}
.hk-leaf svg{display:block;width:100%}
@keyframes hkFall{from{transform:translate(0,0) rotate(0)}to{transform:translate(var(--dx),116vh) rotate(var(--r))}}

.hk-ui{position:absolute;inset:0;z-index:5;pointer-events:none}
.hk-ui button,.hk-plq{pointer-events:auto}
.hk-top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
.hk-top .back{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#hk .hk-hint{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 58px);transform:translateX(-50%);margin:0;max-width:min(32em,70vw);text-align:center;font-size:13px;color:var(--paper-dim);background:rgba(10,8,16,.72);padding:4px 14px;border-radius:999px}
.hk-plq{position:absolute;right:max(3vw,calc(env(safe-area-inset-right,0px) + 10px));top:calc(env(safe-area-inset-top,0px) + 62px);display:flex;flex-direction:column;align-items:center;padding:1.6vh 1.2vh 1.3vh;border-radius:3px;color:#1d130d;opacity:0;
  background:radial-gradient(ellipse at 40% 20%,#fbf3df,#ecdcb8 70%,#dcc595);box-shadow:0 1.4vh 3vh rgba(0,0,0,.55),inset 0 0 0 .45vh #f6ecd4,inset 0 0 0 .7vh #2a1a10,inset 0 0 0 1.1vh #f6ecd4,inset 0 0 0 1.3vh rgba(181,50,30,.5)}
.hk-plq.in{animation:hkPlq 1.1s cubic-bezier(.2,1.2,.4,1) .9s both}
@keyframes hkPlq{from{opacity:0;transform:translateY(-5vh) rotate(-4deg) scale(1.15)}to{opacity:1;transform:none}}
.hk-pv{writing-mode:vertical-rl;font-family:var(--f-display);line-height:1.45;padding:.4vh 0}
.hk-pt{display:block;font-size:clamp(26px,6.4vh,62px);letter-spacing:.04em;min-height:4.4em}
.hk-ps{display:block;font-size:clamp(14px,2.7vh,26px);margin-right:.5vh;color:#7a2a1a;min-height:6.4em}
.hk-pv rt{font-size:.34em}
.hk-seal{margin-top:1vh;width:max(26px,5.2vh);height:max(26px,5.2vh);border-radius:4px;background:#c8402a;display:grid;place-items:center;transform:rotate(-6deg);box-shadow:inset 0 0 0 2px rgba(255,230,200,.55)}
.hk-seal svg{width:68%;height:68%;fill:#fbefd6}
.hk-seal .cut{fill:#c8402a}
.hk-plq .w:hover,.hk-plq .w.sel{color:#b5321e;text-shadow:none}
.hk-end{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 9vh);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;opacity:0;transition:opacity .8s;pointer-events:none}
.hk-end.show{opacity:1}
.hk-end:not(.show) *{pointer-events:none!important}
.hk-end.show button{pointer-events:auto}
.hk-end.show .hk-ttl{animation:hkTtl 1.3s cubic-bezier(.2,1.4,.4,1)}
@keyframes hkTtl{from{transform:scale(.4);opacity:0}}
.hk-ttl{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(32px,8vh,84px);line-height:1.3;color:var(--lantern-hot);white-space:nowrap;pointer-events:auto;
  text-shadow:0 0 18px rgba(255,160,70,.85),0 0 60px rgba(255,110,30,.5),0 4px 0 #3a1408}
.hk-sub{margin:0;font-size:clamp(17px,2.8vh,24px);line-height:2.1;color:var(--paper);text-shadow:0 2px 10px #000,0 0 20px #000;pointer-events:auto}
.hk-end .g-fbtns{margin-top:6px}
.hk-end .g-btn:not(.go){background:rgba(14,10,18,.82)}
/* stage 5B, warm pass: crowd rows, onlookers, lantern garlands, embers */
#hk .fog{background:radial-gradient(ellipse 18% 60% at 10% 85%,rgba(255,196,140,.13),transparent 70%),radial-gradient(ellipse 22% 55% at 35% 90%,rgba(255,180,130,.1),transparent 70%),radial-gradient(ellipse 16% 60% at 62% 80%,rgba(255,200,150,.12),transparent 70%),radial-gradient(ellipse 20% 50% at 86% 88%,rgba(255,180,130,.1),transparent 70%)}
.hk-glow{background:radial-gradient(ellipse 60% 34% at 50% 74%,rgba(255,150,60,.3),transparent 70%),radial-gradient(ellipse 40% 22% at 50% 64%,rgba(255,190,110,.22),transparent 70%);mix-blend-mode:screen}
.hk-row{position:absolute;left:0;right:0;bottom:0;height:100%}

.hk-row.a .hk-c{bottom:20.5%;height:calc(var(--fh,150px) * .56);aspect-ratio:80/116}
.hk-row.b .hk-c{bottom:25.2%;height:calc(var(--fh,150px) * .34);aspect-ratio:80/116;animation-duration:var(--db,60s);animation-delay:calc(var(--db,60s) * var(--k) * -1);filter:saturate(.8) brightness(.82)}
@keyframes hkCross{from{transform:translateX(-12vh)}to{transform:translateX(calc(100vw + 4vh))}}
.hk-cb{display:block;width:100%;height:100%;transform-origin:50% 100%;animation:hkWalk 1s ease-in-out infinite}
.hk-cb>svg{display:block;width:100%;height:100%;overflow:visible}
.hk-c svg .hk-wv,.hk-h .hk-wv{transform-box:fill-box;transform-origin:100% 100%;animation:hkWv .5s ease-in-out infinite alternate}
.hk-c svg .hk-wv2,.hk-h .hk-wv2{transform-box:fill-box;transform-origin:0 100%;animation:hkWv2 .45s ease-in-out infinite alternate}
@keyframes hkWv{from{transform:rotate(-14deg)}to{transform:rotate(12deg)}}
@keyframes hkWv2{from{transform:rotate(16deg)}to{transform:rotate(-12deg)}}
#hk .hk-drm{transform-box:fill-box;transform-origin:center;animation:hkDrm .45s ease-in-out infinite}
@keyframes hkDrm{50%{transform:scale(1.08)}}
#hk .hk-ball{animation:hkBall .7s cubic-bezier(.3,0,.5,1) infinite alternate}
@keyframes hkBall{to{transform:translateY(14px)}}
#hk .hk-lsw{transform-box:fill-box;transform-origin:50% 0;animation:hkGsw 1.2s ease-in-out infinite}
.hk-cheer{animation:hkCheer 1.6s ease-in-out infinite}
@keyframes hkCheer{0%,100%{transform:none}30%{transform:translateY(-6px)}55%{transform:none}70%{transform:translateY(-3px)}}
.hk-sway2{transform-box:fill-box;transform-origin:50% 100%;animation:hkSw2 3s ease-in-out infinite}
@keyframes hkSw2{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.hk-pk{animation:hkPk 6s ease-in-out infinite}

/* ===== words: {surface=gloss|note}, furigana as 漢字(かな) ===== */
const KJ=/([々一-鿿]+)\(([^)]+)\)/g;
const esc=s=>s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const rubyfy=s=>s.replace(KJ,'<ruby>$1<rt>$2</rt></ruby>');
function jp(src){
  return src.replace(/\{([^=}]+)=([^|}]*)(?:\|([^}]*))?\}|([^{]+)/g,(m,surf,g,n,plain)=>{
    if(plain!==undefined)return rubyfy(esc(plain));
    const hasK=/[一-鿿]/.test(surf);
    return `<span class="w" tabindex="0" role="button" data-r="${hasK?esc(surf.replace(KJ,'$2')):''}" data-g="${esc(g)}" data-n="${esc(n||'')}">${rubyfy(esc(surf))}</span>`;
  });
}
function renderJP(root=document){root.querySelectorAll('[data-jp]').forEach(e=>e.innerHTML=jp(e.dataset.jp))}

function toast(x,y,line,name){const t=document.createElement('div');t.className='toast';t.style.left='0px';t.style.top='0px';t.style.visibility='hidden';
  t.innerHTML=`<div class="t-line">${jp(line)}</div>${name?`<div class="t-name">${jp(name)}</div>`:''}`;document.body.appendChild(t);
  const w=t.offsetWidth,h=t.offsetHeight,vw=innerWidth,vh=innerHeight,TOP=64,BOT=vh-76,gap=14;
  const r=eggRect||{left:x,right:x,top:y,bottom:y};const top=Math.max(r.top,TOP-40),bottom=Math.min(r.bottom,BOT+40);
  const cx=(Math.max(r.left,0)+Math.min(r.right,vw))/2,cy=(top+bottom)/2;let L,T,org;
  if(top-h-gap>=TOP){T=top-h-gap;L=cx-w/2;org='50% 100%'}
  else if(bottom+h+gap<=BOT){T=bottom+gap;L=cx-w/2;org='50% 0'}
  else if(Math.min(r.right,vw)+w+gap<=vw-8){L=r.right+gap;T=cy-h/2;org='0 50%'}
  else{L=Math.max(r.left,0)-w-gap;T=cy-h/2;org='100% 50%'}
  L=Math.max(8,Math.min(vw-w-8,L));T=Math.max(TOP,Math.min(BOT-h,T));
  t.style.left=L+'px';t.style.top=T+'px';t.style.setProperty('--org',org);t.style.visibility='';
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),450)},3800)}

let fwOn=false;const FWC=['#ffb04d','#c49bff','#86f0dd','#ff7b8a','#ffd98c'];
function firework(){if(!started||curMode||hkOn||document.hidden)return;const k=W/sceneW,FW=$('#fw');
  const vx=(street.scrollLeft+street.clientWidth*(.15+Math.random()*.7))*k,vy=100+Math.random()*170,col=FWC[(Math.random()*FWC.length)|0],col2=FWC[(Math.random()*FWC.length)|0];
  const g=el('g',{transform:`translate(${vx.toFixed(0)},${vy.toFixed(0)})`},FW);
  el('circle',{r:3,fill:col,class:'fwt'},g);el('circle',{r:140,fill:{'#ffb04d':'url(#gWarm)','#c49bff':'url(#gViolet)','#86f0dd':'url(#gTeal)','#ff7b8a':'url(#gRed)','#ffd98c':'url(#gWarm)'}[col],class:'fwf'},g);
  const n=30,R0=70+Math.random()*40;for(let i=0;i<n;i++){const a=i/n*Math.PI*2,d=R0*(.85+Math.random()*.3);const c=el('circle',{r:i%2?2.6:1.8,fill:i%3?col:col2,class:'fwp'},g);c.style.setProperty('--dx',(Math.cos(a)*d).toFixed(1)+'px');c.style.setProperty('--dy',(Math.sin(a)*d+28).toFixed(1)+'px')}
  setTimeout(()=>{if(soundOn&&started&&!curMode)SFX.boom()},650);setTimeout(()=>g.remove(),3000)}

let lastPtr='mouse',actTimer=null,curAct=null;
function activate(id){clearTimeout(actTimer);if(curAct===id)return;deactivate(true);curAct=id;
  $(`.loc[data-loc="${id}"]`)?.classList.add('active');$(`.plaque[data-loc="${id}"]`)?.classList.add('active');SFX.tick()}
function deactivate(now){const f=()=>{$$('.loc.active,.plaque.active').forEach(e=>e.classList.remove('active'));curAct=null};clearTimeout(actTimer);if(now)f();else actTimer=setTimeout(f,280)}
function wireHover(){
  $$('.loc').forEach(g=>{g.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')activate(g.dataset.loc)});g.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')deactivate()})});
  $$('.plaque').forEach(p=>{p.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')activate(p.dataset.loc)});p.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')deactivate()})});
}

const mode=$('#mode');let curMode=null;

  $('#mLv').innerHTML=level==='easy'?'<ruby>初級<rt>しょきゅう</rt></ruby> N5':'<ruby>中級<rt>ちゅうきゅう</rt></ruby> N4+';
  const seal=$('#mSeal');seal.innerHTML=ICON[id];seal.hidden=!stamps.has(id);
  const b=$('#mStamp');b.disabled=stamps.has(id);b.textContent=stamps.has(id)?'スタンプ OK':'スタンプを おす';
  const g=!!GAMES[id];mode.classList.toggle('playing',g);mode.classList.toggle('guess',GAMES[id]==='guess');mode.classList.toggle('story',GAMES[id]==='story');mode.classList.toggle('lab5',GAMES[id]==='lab');mode.classList.toggle('reading',GAMES[id]==='story'&&!!st4().s);const bg=$('#mBg'),rk=g?roomKey(id):'';if(bg.dataset.room!==rk){bg.dataset.room=rk;bg.innerHTML=g&&BG[id]?BG[id]():''}$('#mWip').hidden=g;$('#mBody').hidden=!g;if(g)renderGame(id)}
function openMode(id,x,y){hidePop();deactivate(true);curMode=id;fillMode(id);
  mode.style.setProperty('--cx',x+'px');mode.style.setProperty('--cy',y+'px');
  mode.hidden=false;mode.scrollTop=0;mode.classList.remove('closing');void mode.offsetWidth;mode.classList.add('open');setCover(true,800);SFX.creak()}
/* while a room or the finale covers the screen, the street is hidden and frozen: frees GPU memory on phones (no flicker) */
let coverT=null;function setCover(on,ms){clearTimeout(coverT);if(on)coverT=setTimeout(()=>{if(curMode||hkOn)document.body.classList.add('cover')},ms||0);else document.body.classList.remove('cover')}
function closeMode(){if(!curMode)return;setCover(false);mode.classList.remove('open');mode.classList.add('closing');curMode=null;SFX.whoosh();setTimeout(()=>{mode.hidden=true;mode.classList.remove('closing')},520);if(gsPend)setTimeout(gsStreet,560);if(hkGateNew){hkGateNew=false;setTimeout(hkAnnounce,1500)}}

/* ----- engine ----- */
const GAMES={1:'warm',2:'guess',3:'sit',4:'story',5:'lab'};
let prog=store.get('obake-prog',{});let helpOpen=false;
function gp(id){const k=id+level;return prog[k]||(prog[k]={i:0,x:0})}
function saveProg(){store.set('obake-prog',prog)}
function deckFor(id){if(GAMES[id]==='lab')return LSTEP;if(GAMES[id]==='story'){const P=st4();return P.s?STORY[P.s].sc[level]:[]}if(GAMES[id]==='guess')return YORD;if(GAMES[id]==='warm'){const W=WARM[level];return W.main.concat(W.extra.slice(0,gp(id).x))}return SIT[level]}
const sp=s=>level==='easy'?' ':'';
const CHEV='<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';
function renderGame(id,dir){
  if(GAMES[id]==='lab'){labRender(id,dir);return}
  if(GAMES[id]==='story'){st4();syncBg(id);mode.classList.toggle('reading',!!gp(id).s);if(!gp(id).s){$('#mBody').innerHTML=libHTML(dir);saveProg();return}}
  const P=gp(id),deck=deckFor(id),n=deck.length,kind=GAMES[id],W=WARM[level];
  if(kind==='guess'){P.got=P.got||[];if(P.i>P.got.length)P.i=P.got.length}
  if(P.i>n)P.i=n;

const YK={
 kitsune:{ru:'Кицунэ',name:'{狐(きつね)=лиса-оборотень|ёкай-лиса, посланница божества Инари}',sfx:()=>SFX.kon(),
  h:'Животное с пушистыми хвостами. Его каменные статуи стоят у святилищ.',
  d:{easy:'{わたしは=я (тема)} {どうぶつの=животного (の)} {妖怪(ようかい)です=ёкай}。{じんじゃに=в святилище (に — место)} {よく=часто} {います=бываю (о живых)}。{しっぽが=хвостов (が)} {たくさん=много} {あります=есть}。{よる=ночью}、{あおい=синие} {ひを=огни (を)|ひ: огонь} {つけます=зажигаю}。{人(ひと)に=в человека (に)} {ばけるのが=превращаться (が)|ばける: оборачиваться; 〜のが: делает глагол существительным} {じょうずです=хорошо умею|じょうず: искусный}。{わたしは=я} {だれ=кто}？',
     hard:'{わたしは=я}{神社(じんじゃ)の=святилища (の)}{神様(かみさま)の=божества (の)}{使(つか)いとして=как посланник|〜として: «в роли, в качестве»}{知(し)られている=известный|しられる: быть известным}{動物(どうぶつ)の=животного}{妖怪(ようかい)だ=ёкай (だ — простая связка)}。{年(とし)をとるほど=чем старше становлюсь|〜ほど: «чем больше…, тем…»}{しっぽが=хвостов (が)}{増(ふ)えて=прибавляется, и|ふえる: увеличиваться}、{最後(さいご)には=в конце концов}{九本(きゅうほん)に=до девяти|〜ほん: счётный суффикс для длинных предметов}{なる=становится}。{人間(にんげん)に=в человека}{化(ば)けるのが=превращаться (が)|ばける: оборачиваться}{得意(とくい)で=мастерски умею, и|とくい: сильная сторона}、{夜(よる)には=ночью (には — выделение)}{青白(あおじろ)い=бледно-голубой}{火(ひ)を=огонь (を)}{ともす=зажигаю|ともす: зажигать (огонь, фонарь)}。{わたしは=я}{だれ=кто}？'},
  dr:{easy:'Я ёкай-животное. Часто бываю в святилищах. Хвостов у меня много. Ночью я зажигаю синие огни. Я ловко превращаюсь в человека. Кто я?',
      hard:'Я ёкай-животное, известный как посланник божества святилища. Чем я старше, тем больше у меня хвостов — в конце концов их становится девять. Я мастерски превращаюсь в человека, а ночью зажигаю бледно-голубой огонь. Кто я?'},
  f:{easy:'{きつねは=лиса (тема)} {としを とると=когда стареет|としをとる: стареть; 〜と: «когда»}、{しっぽが=хвостов (が)} {ふえます=становится больше}。{いちばん=самая} {つよい=сильная} {きつねは=лиса (тема)} {しっぽが=хвостов} {九本(きゅうほん)=девять}！ {はれて いるのに=хотя ясно|〜のに: «хотя, несмотря на»} {あめが=дождь (が)} {ふる=идёт} {ことを=то, что (を)}「{きつねの=лисья} {よめいり=свадьба|よめいり: невеста переходит в дом мужа}」{と=так} {いいます=называют}。',
     hard:'{千年(せんねん)=тысячу лет}{生(い)きた=прожившая}{狐(きつね)は=лиса (тема)}、{しっぽが=хвостов}{九本(きゅうほん)の=девять (の)}「{九尾(きゅうび)の狐(きつね)=девятихвостая лиса}」{になるという=становится, говорят|〜という: «говорят, что»}。{夜(よる)の=ночных}{山(やま)に=в горах}{ゆれる=колышущиеся}{ふしぎな=загадочные}{火(ひ)は=огни (тема)}「{狐火(きつねび)=кицунэби, лисьи огни}」。{そして=а ещё}、{晴(は)れているのに=хотя ясно|〜のに: «хотя»}{雨(あめ)が降(ふ)る=идёт дождь}{ことを=то, что (を)}「{狐(きつね)の嫁入(よめい)り=«лисья свадьба»}」{と呼(よ)ぶ=называют|よぶ: звать, называть}。{狐(きつね)が=лисы (が)}{花嫁(はなよめ)の=невесты}{行列(ぎょうれつ)を=процессию (を)}{人(ひと)に=людьми}{見(み)られないように=чтобы не была увидена|みられる: страдательный залог; 〜ように: «чтобы»}、{雨(あめ)を=дождь}{降(ふ)らせるのだ=насылают|ふらせる: заставить идти (о дожде)}{そうだ=говорят|〜そうだ: «говорят, что»}。'},
  fr:{easy:'С возрастом у лисы становится больше хвостов. У самой сильной лисы их девять! Когда светит солнце, а идёт дождь, это называют «лисьей свадьбой».',
      hard:'Говорят, лиса, прожившая тысячу лет, становится «девятихвостой лисой». Загадочные огоньки, что колышутся ночью в горах, — это «кицунэби», лисьи огни. А дождь при ясном небе называют «лисьей свадьбой»: говорят, это лисы насылают дождь, чтобы люди не увидели их свадебную процессию.'}},

 oni:{ru:'Они',name:'{鬼(おに)=они, рогатый демон-великан}',sfx:()=>{SFX.ohaha();SFX.drum()},
  h:'Рога, дубина и тигровая шкура — главный злодей японских сказок.',
  d:{easy:'{わたしは=я} {大(おお)きくて=большой и|おおきい → おおきくて: соединение прилагательных} {こわい=страшный} {妖怪(ようかい)です=ёкай}。{あたまに=на голове (に)} {つのが=рога (が)} {あります=есть}。{からだは=тело (тема)} {あかや=красное или (や — неполный перечень)} {あおです=синее}。{とらの=тигровые (の)|とら: тигр} {パンツを=трусы (を)} {はいて=надев, и|はく: надевать (обувь, штаны)}、{てつの=железную (の)|てつ: железо} {ぼうを=дубину (を)|ぼう: палка} {もって います=держу|〜ている: состояние}。{まめが=бобы (が)} {きらいです=не люблю}。{わたしは=я} {だれ=кто}？',
     hard:'{わたしは=я}{頭(あたま)に=на голове}{角(つの)が=рога (が)}{生(は)えた=выросли (у которого)|はえる: расти (о рогах, волосах)}{大男(おおおとこ)の=великана (の)}{妖怪(ようかい)だ=ёкай}。{体(からだ)は=тело (тема)}{赤(あか)かったり=то красное|〜たり〜たり: «то…, то…»}{青(あお)かったりする=то синее}。{虎(とら)の=тигровой}{毛皮(けがわ)の=из шкуры (の)}{パンツを=трусы (を)}{はいて=надев, и}、{金棒(かなぼう)を=железную дубину (を)|かなぼう: дубина с шипами}{持(も)ち歩(ある)いている=ношу с собой|もちあるく: носить при себе}。{節分(せつぶん)の=Сэцубуна (の)|せつぶん: праздник начала весны, около 3 февраля}{日(ひ)に=в день}{豆(まめ)を=бобами (を)}{ぶつけられるのが=когда в меня кидают (が)|ぶつけられる: страдательный залог от ぶつける}、{何(なに)よりも=больше всего на свете}{苦手(にがて)だ=терпеть не могу|にがて: то, что неприятно или плохо даётся}。{わたしは=я}{だれ=кто}？'},
  dr:{easy:'Я большой и страшный ёкай. На голове у меня рога. Тело красное или синее. Я ношу тигровые трусы и держу железную дубину. Не люблю бобы. Кто я?',
      hard:'Я ёкай-великан, у которого на голове растут рога. Тело у меня то красное, то синее. Я ношу трусы из тигровой шкуры и всюду таскаю железную дубину. Больше всего на свете не терплю, когда в день Сэцубун в меня кидаются бобами. Кто я?'},
  f:{easy:'{二月(にがつ)三日(みっか)ごろは=около 3 февраля|〜ごろ: «около»}「{せつぶん=Сэцубун — праздник начала весны}」{です=есть}。{いえで=дома (で)} {まめを=бобы (を)} {なげて=бросая|なげる: бросать}、「{おには=они (тема)} {そと=наружу}！ {ふくは=счастье (тема)|ふく: удача, счастье} {うち=в дом}！」{と=— (цитата)} {いいます=говорят}。{そして=а потом} {としの=своего возраста (の)} {かずだけ=столько, сколько|かず: число; 〜だけ: «столько, сколько»} {まめを=бобов} {たべます=съедают}。',
     hard:'{節分(せつぶん)の=Сэцубуна}{夜(よる)=ночью}、「{鬼(おに)は外(そと)=они — вон}、{福(ふく)は内(うち)=счастье — в дом}！」{と=—}{叫(さけ)びながら=крича|〜ながら: «одновременно с…»}{豆(まめ)を=бобы}{まく=разбрасывают}。{では=а}、{なぜ=почему}{鬼(おに)は=они}{虎(とら)のパンツを=тигровые трусы}{はいているのか=носит?|〜のか: «почему же…?»}。{鬼(おに)が=они (が)}{出入(でい)りする=входят и выходят}{方角(ほうがく)=сторона света}「{鬼門(きもん)=кимон, «врата демонов»}」{は=(тема)}{北東(ほくとう)=северо-восток}。{昔(むかし)の=старинное}{言(い)い方(かた)では=по названию}「{丑寅(うしとら)=бык-тигр|в старину стороны света называли животными зодиака}」{だ=это}。{だから=поэтому}{鬼(おに)は=они}{牛(うし)の=бычьи}{角(つの)を=рога}{生(は)やし=отрастил, и|はやす: отращивать}、{虎(とら)の=тигровую}{毛皮(けがわ)を=шкуру}{身(み)につけているのだ=носит на себе|みにつける: надевать на себя; 〜のだ: объяснение}。'},
  fr:{easy:'Около 3 февраля — Сэцубун. Дома бросают бобы и кричат: «Они — вон! Счастье — в дом!» А потом съедают столько бобов, сколько тебе лет.',
      hard:'В ночь Сэцубуна разбрасывают бобы с криком: «Они — вон! Счастье — в дом!» А почему они носит тигровые трусы? Сторона, откуда приходят демоны, — «кимон» — это северо-восток, по-старинному «бык-тигр». Вот почему у они бычьи рога и тигровая шкура.'}},

 kasa:{ru:'Каса-обакэ',name:'{からかさおばけ=каса-обакэ, зонтик-оборотень|からかさ: старый бумажный зонт; おばけ: призрак, оборотень}',sfx:()=>SFX.boing(),
  h:'Старая вещь, которая спасает от дождя. Ты уже встречал его на улице.',
  d:{easy:'{わたしは=я} {あめの=дождливый (の)} {日(ひ)に=в день (に)} {つかう=которой пользуются} {どうぐの=вещи (の)|どうぐ: инструмент, вещь} {妖怪(ようかい)です=ёкай}。{目(め)が=глаз (が)} {一(ひと)つ=один}、{したが=язык (が)|した: язык во рту} {ながいです=длинный}。{足(あし)は=нога (тема)} {一本(いっぽん)=одна (штука)} {だけです=только}。{ぴょんぴょん=прыг-прыг} {とびます=прыгаю}。{わたしは=я} {だれ=кто}？',
     hard:'{わたしは=я}{古(ふる)くなった=состарившейся}{道具(どうぐ)の=вещи (の)}{妖怪(ようかい)だ=ёкай}。{道具(どうぐ)は=вещи (тема)}{百年(ひゃくねん)たつと=когда пройдёт сто лет|たつ: проходить (о времени)}{魂(たましい)を=душу (を)}{持(も)つと=обретают — так|〜といわれている: «говорят, что…»}{言(い)われている=говорят}。{昔(むかし)は=раньше}{雨(あめ)の日(ひ)に=в дождь}{人(ひと)の=людям}{役(やく)に立(た)っていたが=был полезен, но|やくにたつ: быть полезным}、{今(いま)では=теперь}{大(おお)きな=большим}{一(ひと)つ目(め)で=единственным глазом|ひとつめ: одноглазый}{人(ひと)を=людей (を)}{にらみ=сверлю взглядом, и|にらむ: сердито смотреть}、{長(なが)い舌(した)を=длинный язык (を)}{べろんと=бе-е! (высунуть язык)}{出(だ)して=высунув}、{一本足(いっぽんあし)で=на одной ноге}{ぴょんぴょん=прыг-прыг}{跳(は)ね回(まわ)っている=скачу туда-сюда|はねまわる: скакать кругами}。{わたしは=я}{だれ=кто}？'},
  dr:{easy:'Я ёкай-вещь, которой пользуются в дождливый день. У меня один глаз и длинный язык. Нога — всего одна. Я скачу — прыг-прыг. Кто я?',
      hard:'Я ёкай состарившейся вещи. Говорят, через сто лет вещи обретают душу. Раньше я выручал людей в дождь, а теперь сверлю людей огромным единственным глазом, высовываю длинный язык — бе-е! — и скачу на одной ноге. Кто я?'},
  f:{easy:'{どうぐは=вещи (тема)} {百年(ひゃくねん)=сто лет} {たつと=когда пройдёт|たつ: проходить (о времени)}、{たましいを=душу (を)} {もつと=обретают — так} {いわれて います=говорят|〜といわれている: «говорят, что…»}。{からかさおばけも=каса-обакэ тоже} {その=из них} {ひとつです=один}。{ちょうちんや=фонарь и т.п. (や)} {げたの=гэта (の)|げた: деревянные сандалии} {おばけも=призраки тоже} {います=есть}。',
     hard:'{からかさおばけは=каса-обакэ (тема)}{とても=очень}{有名(ゆうめい)なのに=знаменит, хотя|〜のに: «хотя»}、{昔話(むかしばなし)には=в старинных сказках}{ほとんど=почти}{出(で)てこない=не появляется}。{江戸時代(えどじだい)の=эпохи Эдо|1603–1868 годы}{かるたや=карт карута и т.п.|かるた: игра с карточками-картинками}{おもちゃの=игрушек (の)}{絵(え)で=благодаря картинкам}{人気者(にんきもの)に=любимцем}{なった=стал}、{いわば=так сказать}「{キャラクター=персонаж, маскот}」{の=(の)}{妖怪(ようかい)なのだ=ёкай, вот оно что|〜のだ: объяснение}。{一本足(いっぽんあし)で=на одной ноге}{ぴょんと=прыг!}{跳(と)ぶ=прыгающий}{姿(すがた)は=облик (тема)}、{今(いま)も=и сейчас}{お化(ば)け屋敷(やしき)の=комнаты страха (の)|おばけやしき: аттракцион «дом с привидениями»}{定番(ていばん)だ=классика, непременный элемент}。'},
  fr:{easy:'Говорят, через сто лет вещи обретают душу. Каса-обакэ — один из таких ёкаев. Есть ещё призраки-фонари и призраки-сандалии гэта.',
      hard:'Каса-обакэ очень знаменит, но в старинных сказках почти не встречается. Любимцем он стал благодаря картинкам на картах-карута и игрушках эпохи Эдо — такой «ёкай-персонаж». Его прыжки на одной ноге и сейчас — классика японских комнат страха.'}},

 yuki:{ru:'Юки-онна',name:'{雪女(ゆきおんな)=юки-онна, снежная женщина}',sfx:()=>{SFX.wind();SFX.ting()},
  h:'Женщина в белом. Появляется в горах в метель.',
  d:{easy:'{わたしは=я} {ふゆの=зимний (の)} {妖怪(ようかい)です=ёкай}。{しろい=белое} {きものを=кимоно (を)} {きて=надев, и|きる: надевать (одежду)}、{かみは=волосы (тема)} {ながくて=длинные и} {くろいです=чёрные}。{ゆきの=снежной (の)} {よるに=ночью (に)} {やまで=в горах (で)} {人(ひと)に=с людьми (に)} {あいます=встречаюсь}。{わたしの=моё} {いきは=дыхание (тема)} {とても=очень} {つめたいです=холодное}。{わたしは=я} {だれ=кто}？',
     hard:'{わたしは=я}{吹雪(ふぶき)の=метельной (の)|ふぶき: метель, буран}{夜(よる)にだけ=только ночью|〜だけ: «только»}{姿(すがた)を見(み)せる=показывающаяся|すがたをみせる: показываться}、{真(ま)っ白(しろ)な=белоснежном}{着物(きもの)の=в кимоно (の)}{女(おんな)の=женщина-}{妖怪(ようかい)だ=ёкай}。{肌(はだ)は=кожа (тема)}{雪(ゆき)のように=как снег|〜のように: «как, подобно»}{白(しろ)く=белая, и}、{ふっと=фу — (легко, вдруг)}{息(いき)を=дыханием (を)}{かけると=если дохну|いきをかける: дышать на кого-то; 〜と: «если/когда»}、{人(ひと)は=человек (тема)}{凍(こお)ってしまう=замерзает насмерть|こおる: замерзать; 〜てしまう: необратимо}。{でも=но}、{ときどき=иногда}{人間(にんげん)に=в человека}{恋(こい)をしてしまう=влюбляюсь|こいをする: влюбляться; 〜てしまう: «невольно»}{こともある=бывает|〜こともある: «бывает, что…»}。{わたしは=я}{だれ=кто}？'},
  dr:{easy:'Я зимний ёкай. На мне белое кимоно, волосы длинные и чёрные. Снежной ночью я встречаю людей в горах. Моё дыхание очень холодное. Кто я?',
      hard:'Я ёкай-женщина в белоснежном кимоно, показываюсь только метельными ночами. Кожа у меня белая, как снег, и если я дохну на человека — он замерзает. Но иногда я невольно влюбляюсь в человека. Кто я?'},
  f:{easy:'{ゆきおんなの=о юки-онна (の)} {はなしは=истории (тема)} {ゆきが=снега (が)} {おおい=много (где)} {ところに=в местах (に)} {たくさん=много} {あります=есть}。{いちばん=самая} {ゆうめいなのは=известная — (тема)}、{ラフカディオ・ハーンの=Лафкадио Хирна (の)|писатель, собиравший японские легенды} {本(ほん)=книги}『{怪談(かいだん)=«Квайдан» — «Страшные истории»}』{の=(の)} {はなしです=история}。',
     hard:'{雪女(ゆきおんな)の=о юки-онна}{話(はなし)で=среди историй}{いちばん=самая}{有名(ゆうめい)なのは=известная — (тема)}、{ラフカディオ・ハーンの=Лафкадио Хирна|писатель, собиравший японские легенды}『{怪談(かいだん)=«Квайдан»}』{の=(の)}{話(はなし)だ=история}。{雪女(ゆきおんな)は=юки-онна}{若(わか)い=молодого}{男(おとこ)を=мужчину}{助(たす)けるが=щадит, но|たすける: спасать}、「{今夜(こんや)の=сегодняшней ночи}{ことは=о том (тема)}{だれにも=никому}{言(い)うな=не говори|〜な: строгий запрет}」{と=—}{約束(やくそく)させる=заставляет пообещать|〜させる: побудительный залог}。{何年(なんねん)もたって=через много лет}、{男(おとこ)が=мужчина}{妻(つま)に=жене}{あの夜(よる)の=о той ночи}{話(はなし)を=рассказ}{してしまうと=взял и рассказал — и тогда|〜てしまう: «сделал непоправимое»}――{その=эта}{妻(つま)が=жена}、{じつは=на самом деле}{あの=та самая}{雪女(ゆきおんな)だったのだ=юки-онна и была|〜のだ: объяснение}。'},
  fr:{easy:'Историй о юки-онна много там, где много снега. Самая известная — из книги Лафкадио Хирна «Квайдан».',
      hard:'Самая известная история о юки-онна — из «Квайдана» Лафкадио Хирна. Юки-онна щадит молодого мужчину, но заставляет его пообещать: «Никому не рассказывай о сегодняшней ночи». Прошли годы, и мужчина рассказал о той ночи своей жене… а жена на самом деле и была той самой юки-онна.'}},

 zori:{ru:'Бакэ-дзори',name:'{化(ば)け草履(ぞうり)=бакэ-дзори, сандалия-оборотень|ばける: превращаться; ぞうり: соломенные сандалии}',sfx:()=>SFX.slap(),
  h:'Ожившая вещь. Её носят на ногах.',
  d:{easy:'{わたしは=я} {はきものの=обуви (の)|はきもの: обувь} {妖怪(ようかい)です=ёкай}。{わたしは=я} {ふるく なりました=состарилась|ふるい → ふるくなる: становиться старым}。{だれかが=кто-то (が)} {わたしを=меня (を)} {すてました=выбросил}。{目(め)が=глаз (が)} {一(ひと)つ=один}、{手(て)と=руки и} {足(あし)が=ноги (が)} {あります=есть}。{よる=ночью}、{いえの=дома (の)} {なかを=внутри, по (を — где движутся)} {ペタペタ=шлёп-шлёп} {はしります=бегаю}。{わたしは=я} {だれ=кто}？',
     hard:'{わたしは=я}{もともと=изначально}、{毎日(まいにち)=каждый день}{人(ひと)に=людьми (に — кем)}{はかれていた=которую носили|はかれる: страдательный залог от はく}{道具(どうぐ)だった=вещью была}。{ぼろぼろになったら=когда истрепалась|ぼろぼろ: рваный, истрёпанный; 〜たら: «когда»}、{ありがとうも=даже «спасибо»}{言(い)われずに=не услышав|〜ずに: «не делая»}{ごみ捨(す)て場(ば)へ=на помойку}。{くやしくて=было так обидно, что|くやしい: досадно, обидно}、{目(め)が一(ひと)つ=один глаз}、{手(て)と足(あし)が=руки и ноги}{生(は)えてしまった=взяли и выросли|〜てしまう: «взяло и случилось»}。{今(いま)は=теперь}{夜(よる)になると=когда наступает ночь|〜と: «когда (всегда)»}、{ぺたぺたと=шлёп-шлёп}{家(いえ)の中(なか)を=по дому}{走(はし)り回(まわ)っている=бегаю туда-сюда|はしりまわる: бегать кругами}。{わたしは=я}{だれ=кто}？'},
  dr:{easy:'Я ёкай-обувь. Я состарилась. Кто-то меня выбросил. У меня один глаз, есть руки и ноги. Ночью я бегаю по дому — шлёп-шлёп. Кто я?',
      hard:'Раньше я была вещью, которую люди каждый день носили на ногах. Когда я истрепалась, меня, даже не сказав «спасибо», отправили на помойку. От обиды у меня выросли один глаз, руки и ноги. Теперь, как наступает ночь, я шлёпаю туда-сюда по всему дому. Кто я?'},
  f:{easy:'{だいじに=бережно} {しないで=не обращаясь|〜ないで: «не делая»} {すてた=выброшенная} {どうぐは=вещь (тема)}、{おこって=рассердившись} {妖怪(ようかい)に=в ёкая} {なります=превращается}。{この=такого} {妖怪(ようかい)を=ёкая (を)}「{つくもがみ=цукумогами — ожившая вещь}」{と=так} {いいます=называют}。{ものは=вещи (тема)} {だいじに=бережно} {つかいましょう=давайте использовать}！',
     hard:'{大事(だいじ)にされずに=без бережного отношения|だいじにされる: когда тебя берегут; 〜ずに: «не…»}{捨(す)てられた=выброшенные}{道具(どうぐ)は=вещи (тема)}「{付喪神(つくもがみ)=цукумогами — ожившая вещь}」{になると=становятся — так}{言(い)われる=говорят}。{岩手(いわて)の=из Иватэ|префектура на севере Японии}{昔話(むかしばなし)では=в старинной сказке}、{古(ふる)い=старая}{はきものたちが=обувь (たち — множество)}{夜(よ)な夜(よ)な=ночь за ночью}「{カラリンコロリン カンコロリン=кара-рин-коро-рин (стук деревянных сандалий)}、{まなぐ三(みっ)つに=три глаза, а к ним|まなぐ: «глаз» на местном диалекте}{歯(は)二枚(にまい)=два зуба}」{と=—}{歌(うた)ったという=пела, говорят}。'},
  fr:{easy:'Вещь, которую выбросили без уважения, сердится и превращается в ёкая. Такого ёкая называют «цукумогами». Давайте беречь вещи!',
      hard:'Говорят, вещи, которые выбросили без уважения, становятся «цукумогами». В старинной сказке из Иватэ старая обувь ночь за ночью распевала: «Кара-рин-коро-рин, кан-коро-рин, три глаза да два зуба!» Три глаза — это три дырочки деревянной сандалии гэта, а два зуба — две её подставки.'}},

 amabie:{ru:'Амабиэ',name:'{アマビエ=Амабиэ|морской ёкай-пророк}',sfx:()=>{SFX.splash();SFX.shimmer()},
  h:'Длинные волосы, клюв и чешуя. Очень прославился в 2020 году.',

    t:'{ぼくは=я (тема)} {小(ちい)さい=маленьком} {すし屋(や)で=в суши-баре (で — место действия)|〜や: лавка, заведение} {アルバイトを=подработку (を)} {しています=делаю|〜ている: действие длится}。\n{きゅうりの=из огурца (の)} {まきずしは=ролл (тема)|まきずし: суши, свёрнутые в лист нори} 「{かっぱまき=каппа-маки}」{と=— (と — цитата)} {いいます=называется}。\n「{どうして=почему} {かっぱまきですか=каппа-маки?}？」{と=— (цитата)} {大将(たいしょう)に=шефу (に — кому)|たいしょう: так зовут хозяина-повара суши-бара} {ききました=спросил}。',
    q:'{ぼくは=я} {どこで=где} {アルバイトを=подработку} {していますか=делаю?}？',qr:'Где «я» подрабатываю?',
    o:['{本屋(ほんや)=книжный магазин}','{コンビニ=круглосуточный магазин}','{すし屋(や)=суши-бар}'],a:2},
   {sc:'k_lore',ru:'Шеф улыбнулся и сказал: «Каппа — речной ёкай. Он обожает огурцы. У каппы на голове блюдце, в нём налита вода. Если вода прольётся, каппа теряет силы. Поэтому каппа ни за что не наклоняет голову».',
    t:'{大将(たいしょう)は=шеф (тема)} {わらって=улыбнувшись|わらう → わらって} {いいました=сказал}。\n「{かっぱは=каппа (тема)} {川(かわ)の=речной (の)} {妖怪(ようかい)だよ=ёкай|だよ: разговорное «это»; よ — сообщаю новое}。{きゅうりが=огурцы (が)} {大(だい)すきなんだ=обожает|〜なんだ: разговорное объяснение}。」\n「{かっぱの=у каппы (の)} {あたまには=на голове (には)} {おさらが=блюдце (が)} {ある=есть}。{おさらには=в блюдце} {水(みず)が=вода (が)} {入(はい)っている=налита|はいる: входить; 〜ている: состояние}。{水(みず)が=вода} {こぼれると=если прольётся|こぼれる: проливаться; 〜と: «если (всегда)»}、{かっぱは=каппа} {力(ちから)が=силы (が)} {なくなる=пропадают}。」\n「{だから=поэтому}、{かっぱは=каппа} {ぜったい=ни за что|ぜったい + отрицание: «никогда»} {あたまを=голову (を)} {さげないんだ=не опускает|さげる: опускать; さげない — отрицание}。」',
    q:'{かっぱの=у каппы} {あたまには=на голове} {何(なに)が=что (が)} {ありますか=есть?}？',qr:'Что у каппы на голове?',
    o:['{ぼうし=шляпа}','{おさら=блюдце}','{きゅうり=огурец}'],a:1},
   {sc:'k_guest',ru:'В тот вечер пришёл странный посетитель. Длинный дождевик и большая шляпа. Но на улице никакого дождя. Посетитель тихо сказал: «Двадцать каппа-маки, пожалуйста».',
    t:'{その=того} {日(ひ)の=дня (の)} {夜(よる)=вечером}、{へんな=странный} {おきゃくさんが=посетитель (が)} {来(き)ました=пришёл}。\n{ながい=длинный} {レインコートと=дождевик и (と — «и»)} {大(おお)きい=большая} {ぼうし=шляпа}。{でも=но}、{そとは=на улице (тема)} {雨(あめ)じゃ ありません=не дождь|じゃ ありません: разговорное отрицание от です}。\n{おきゃくさんは=посетитель} {小(ちい)さい=тихим} {こえで=голосом (で — способ)} {いいました=сказал}。\n「{かっぱまきを=каппа-маки (を)} {二十本(にじゅっぽん)=двадцать штук|〜ほん: счёт длинных предметов — роллов, бутылок}、{ください=дайте, пожалуйста}。」',
    q:'{そとは=на улице} {雨(あめ)ですか=дождь?}？',qr:'На улице идёт дождь?',
    o:['{はい=да}、{雨(あめ)です=дождь}','{ゆきです=снег|ゆき: снег}','{いいえ=нет}、{雨(あめ)じゃ ありません=не дождь}'],a:2},
   {sc:'k_eat',ru:'Посетитель сел за стойку и съел все каппа-маки. Хрум-хрум, хрум-хрум. Но вот что странно: спина всё время прямая. Голова совсем не двигается. Кап! Со шляпы упала капля воды.',
    t:'{おきゃくさんは=посетитель} {カウンターに=за стойку (に)} {すわって=сел, и|すわる → すわって}、{かっぱまきを=каппа-маки} {ぜんぶ=все} {たべました=съел}。{ぽりぽり=хрум-хрум|звук хрустящей еды}、{ぽりぽり=хрум-хрум}。\n{でも=но}、{へんです=странно}。{せなかは=спина (тема)} {ずっと=всё время} {まっすぐ=прямая}。{あたまは=голова} {ぜんぜん=совсем|ぜんぜん + отрицание: «совсем не»} {うごきません=не двигается}。\n{ぽたっ=кап!|звук одной капли}。{ぼうしから=со шляпы (から — откуда)} {水(みず)が=вода} {おちました=упала}。',
    q:'{どうして=почему} {おきゃくさんは=посетитель} {あたまを=голову} {さげませんか=не опускает?}？',qr:'Почему посетитель не опускает голову?',
    o:['{くびが=шея} {いたいから=болит, поэтому|〜から: потому что}','{おさらの=из блюдца} {水(みず)が=вода} {こぼれるから=прольётся, поэтому}','{ねむいから=хочет спать, поэтому}'],a:1},
   {sc:'k_bow',nx:1,ru:'«Спасибо за угощение». Посетитель положил деньги и встал. Я, как всегда, низко поклонился: «Спасибо вам большое!» И тут посетитель тоже…',
    t:'「{ごちそうさま=спасибо за угощение|так говорят после еды}。」{おきゃくさんは=посетитель} {お金(かね)を=деньги (を)} {おいて=положив|おく → おいて}、{立(た)ちました=встал}。\n{ぼくは=я} {いつものように=как всегда|いつも: всегда; 〜ように: «так же, как»}、{ふかく=низко, глубоко} {おじぎを=поклон (を)|おじぎ: поклон} {しました=сделал}。\n「{ありがとうございました=спасибо!|так в Японии провожают посетителей}！」\n{すると=и тут}、{おきゃくさんも=посетитель тоже}……',
    q:'{おきゃくさんは=посетитель} {どう=как} {しますか=поступит?}？',qr:'Что сделает посетитель?',
    o:['{おじぎを=поклон} {かえす=возвращает|かえす: возвращать, отвечать тем же}','{大(おお)きい=громким} {こえで=голосом} {わらう=смеётся}','{お金(かね)を=деньги} {わすれる=забывает}'],a:0},
   {sc:'k_splash',fx:'splash',ru:'Поклон. Плюх! Из-под шляпы пролилась вода. Лицо посетителя стало зелёным, он зашатался. «Ой…!» — и посетитель убежал в сторону реки.',
    t:'{ぺこり=кивок-поклон|звукоподражание быстрому поклону}。{ばしゃっ=плюх!|звук выплеснувшейся воды}！\n{ぼうしの=шляпы (の)} {下(した)から=из-под (から)} {水(みず)が=вода} {こぼれました=пролилась}。\n{おきゃくさんの=посетителя} {かおが=лицо (が)} {みどりに=зелёным (に)} {なりました=стало|〜に なる: становиться}。{からだは=тело} {ふらふら=шатается|ふらふら: еле держится на ногах}。\n「{あっ=ой}……！」{おきゃくさんは=посетитель} {川(かわ)の=реки (の)} {ほうへ=в сторону (へ)} {にげて いきました=убежал|にげる: убегать; 〜ていく: удаляться}。',
    q:'{おきゃくさんの=посетителя} {かおは=лицо} {何色(なにいろ)に=какого цвета (に)} {なりましたか=стало?}？',qr:'Каким стало лицо посетителя?',
    o:['{あか=красный}','{しろ=белый}','{みどり=зелёный}'],a:2},
   {sc:'k_morning',ru:'На следующее утро перед заведением стояло ведро. Внутри — полно свежей рыбы! Трепыхается. И ещё записка: «Простите за вчерашнее». Шеф засмеялся: «Хорошо бы он пришёл снова».',
    t:'{つぎの=следующее} {朝(あさ)=утро}、{みせの=заведения (の)} {まえに=перед (に)} {バケツが=ведро (が)} {ありました=стояло}。\n{中(なか)には=внутри} {あたらしい=свежая} {さかなが=рыба} {いっぱい=полно}！{ぴちぴち=трепыхается|звук живой прыгающей рыбы}。\n{手紙(てがみ)も=и записка тоже} {ありました=была}。「{きのうは すみませんでした=простите за вчерашнее|すみませんでした: извинение за прошлое}」\n{大将(たいしょう)は=шеф} {わらいました=засмеялся}。「{また=снова} {来(き)て ほしいな=хочется, чтобы пришёл|〜てほしい: «хочу, чтобы кто-то…»}。」',
    q:'{バケツの=ведра} {中(なか)には=внутри} {何(なに)が=что} {ありましたか=было?}？',qr:'Что было в ведре?',
    o:['{さかな=рыба}','{きゅうり=огурцы}','{おさら=блюдца}'],a:0}
  ],
  hard:[
   {sc:'k_bar',ru:'С тех пор как поступил в университет, подрабатываю в маленьком суши-баре у станции. Старое заведение — стойка всего на восемь мест. Однажды я спросил шефа, который крутил тонкий огуречный ролл: «А почему это называется каппа-маки?»',
    t:'{大学(だいがく)に=в университет}{入(はい)ってから=с тех пор как поступил|〜てから: «после того как»}、{駅前(えきまえ)の=у станции}{小(ちい)さな=маленьком}{寿司屋(すしや)で=в суши-баре}{バイトを=подработку|バイト — сокращение от アルバイト}{している=делаю}。{カウンター=стойка}{八席(はっせき)だけの=всего на восемь мест|〜せき: счёт мест}、{古(ふる)い=старое}{店(みせ)だ=заведение}。\n{ある日(ひ)=однажды}、{きゅうりの=огуречный}{細巻(ほそま)きを=тонкий ролл (を)}{巻(ま)いている=сворачивающему|まく: сворачивать}{大将(たいしょう)に=шефу (に)|たいしょう: так зовут хозяина-повара суши-бара}{聞(き)いてみた=решил спросить|〜てみる: попробовать сделать}。\n「{これ=это}、{なんで=почему (разг.)}『{かっぱ巻(ま)き=каппа-маки}』{って=— (って — разговорная цитата)}{言(い)うんですか=называется?|〜んですか: просьба объяснить}？」',
    q:['{「ぼく」は=«я» (тема)}{どんな=какой}{店(みせ)で=в заведении}{働(はたら)いていますか=работает?}？','{あなたは=вы}{寿司(すし)が=суши}{好(す)きですか=любите?}？{何(なに)が=что}{好(す)きですか=нравится?}？'],
    qr:['В каком заведении работает «я»?','Ты любишь суши? Что больше всего?'],
    help:['{駅前(えきまえ)=у станции}','{カウンター席(せき)=места за стойкой}','{マグロ=тунец}','{サーモン=лосось}','{回転寿司(かいてんずし)=суши с конвейера}','{生魚(なまざかな)=сырая рыба}']},
   {sc:'k_lore',ru:'Шеф ответил, не отрываясь от работы: «Есть такой речной ёкай — каппа. Огурцы — его любимое лакомство. Поэтому огуречный ролл — каппа-маки. И ещё: у каппы на голове блюдце. Если вода из блюдца прольётся, у него пропадают силы. Поэтому эти ребята ни за что не наклоняют голову». «Надо же», — подумал я. Тогда я считал это просто старой сказкой.',
    t:'{大将(たいしょう)は=шеф}{手(て)を=руки}{止(と)めずに=не останавливая|〜ずに: «не делая»}{答(こた)えた=ответил}。\n「{かっぱっていう=под названием каппа|〜っていう: разговорное «который зовётся»}{川(かわ)の=речной}{妖怪(ようかい)が=ёкай}{いてな=есть, понимаешь|な — мужская разговорная частица}、{きゅうりが=огурцы}{大好物(だいこうぶつ)なんだ=любимое лакомство|だいこうぶつ: самая любимая еда}。{だから=поэтому}、{きゅうりの=огуречный}{巻(ま)き物(もの)は=ролл (тема)}{かっぱ巻(ま)き=каппа-маки}。」\n「{それとな=и ещё вот что}、{かっぱの=у каппы}{頭(あたま)には=на голове}{皿(さら)が=блюдце}{ある=есть}。{皿(さら)の=в блюдце}{水(みず)が=вода}{こぼれたら=если прольётся|〜たら: «если, когда»}、{力(ちから)が=сила}{出(で)なくなる=пропадает|〜なくなる: «перестаёт»}。{だから=поэтому}{あいつらは=эти ребята (разг.)|あいつ: «тот тип», грубовато-дружески}{絶対(ぜったい)に=ни за что}{頭(あたま)を=голову}{下(さ)げないんだよ=не наклоняют, понимаешь}。」\n{へえ=надо же}、{と=— (цитата)}{思(おも)った=подумал}。{その時(とき)は=тогда (は — контраст)}、{ただの=просто}{昔話(むかしばなし)だと=что это старая сказка}{思(おも)っていた=думал}。',
    q:['{かっぱの=каппы}{弱点(じゃくてん)は=слабое место}{何(なん)ですか=что?}？','{なぜ=почему}{かっぱは=каппа}{頭(あたま)を=голову}{下(さ)げないのですか=не наклоняет?}？'],
    qr:['Какое слабое место у каппы?','Почему каппа не наклоняет голову?'],
    help:['{皿(さら)=блюдце}','{水(みず)がこぼれる=вода проливается}','{力(ちから)が出(で)ない=нет сил}','{〜から=потому что ~}','{〜てしまう=(нечаянно) случится}']},
   {sc:'k_guest',ru:'В тот вечер, незадолго до закрытия, вошёл странный посетитель. Длинный дождевик да широкополая шляпа. Но сегодня не упало ни капли дождя. Не глядя в меню, посетитель тихо сказал: «…Каппа-маки. Двадцать штук».',
    t:'{その夜(よる)=в тот вечер}、{閉店(へいてん)の=закрытия}{少(すこ)し前(まえ)に=незадолго до}、{変(へん)な=странный}{客(きゃく)が=посетитель}{入(はい)ってきた=вошёл|〜てくる: движение к говорящему}。\n{長(なが)い=длинный}{レインコートに=дождевик да ещё|AにB: «A плюс B» (о наряде)}、{つばの広(ひろ)い=широкополая|つば: поля шляпы}{帽子(ぼうし)=шляпа}。{でも=но}、{今夜(こんや)は=сегодня вечером}{一滴(いってき)も=ни капли|いってき: одна капля; + も и отрицание: «ни одной»}{雨(あめ)が=дождь}{降(ふ)っていない=не идёт}。\n{客(きゃく)は=посетитель}{メニューも=даже в меню}{見(み)ずに=не глядя|〜ずに: «не делая»}、{小(ちい)さな=тихим}{声(こえ)で=голосом}{言(い)った=сказал}。\n「……{かっぱ巻(ま)き=каппа-маки}、{二十本(にじゅっぽん)=двадцать штук|〜ほん: счёт длинных предметов}。」',
    q:['{この=этот}{客(きゃく)の=посетителя}{どこが=что}{変(へん)ですか=странного?}？','{あなたが=вы}{店員(てんいん)なら=если бы были продавцом|〜なら: «если»}、{何(なに)か=что-нибудь}{言(い)いますか=скажете?}？'],
    qr:['Что странного в этом посетителе?','Если бы ты работал там — сказал бы что-нибудь?'],
    help:['{晴(は)れている=ясно, нет дождя}','{顔(かお)が見(み)えない=лица не видно}','{〜のに=хотя, а ведь ~}','{〜すぎる=слишком ~}','{あやしい=подозрительный}']},
   {sc:'k_eat',ru:'Посетитель сел с краю стойки и съел все двадцать. Хрум-хрум, хрум-хрум. Странной была его осанка. Спина прямая, как линейка, и голова ни на сантиметр не двигалась — ни когда он ел, ни когда пил чай. С полей шляпы — кап — упала вода. …А ведь никакого дождя нет.',
    t:'{客(きゃく)は=посетитель}{カウンターの=стойки}{端(はし)に=с краю}{座(すわ)って=сел, и}、{二十本(にじゅっぽん)を=все двадцать}{全部(ぜんぶ)=целиком}{食(た)べた=съел}。{ぽりぽり=хрум-хрум|звук хрустящей еды}、{ぽりぽり=хрум-хрум}。\n{不思議(ふしぎ)なのは=странной была|〜なのは: «то, что ~» (тема)}{姿勢(しせい)だった=осанка}。{背中(せなか)は=спина}{定規(じょうぎ)みたいに=как линейка|〜みたいに: «как, словно»}{まっすぐで=прямая, и}、{食(た)べる時(とき)も=и когда ест}、{お茶(ちゃ)を=чай}{飲(の)む時(とき)も=и когда пьёт}、{頭(あたま)が=голова}{一(いっ)センチも=ни на сантиметр|〜も + отрицание: «даже ~ не»}{動(うご)かない=не двигается}。\n{帽子(ぼうし)の=шляпы}{つばから=с полей}、{ぽたり=кап|звук одной капли}、{と=— (と после звукоподражания)}{水(みず)が=вода}{落(お)ちた=упала}。……{雨(あめ)なんか=никакого дождя|なんか: «какой-то там», пренебрежительно}{降(ふ)っていないのに=не идёт, а ведь|〜のに: «хотя»}。',
    q:['{客(きゃく)の=посетителя}{姿勢(しせい)は=осанка}{どうでしたか=какой была?}？','{なぜ=почему}{頭(あたま)を=голову}{動(うご)かさないのだと=не двигает — что|うごかす: двигать (что-то)}{思(おも)いますか=думаете?}？'],
    qr:['Какой была осанка посетителя?','Как ты думаешь, почему он не двигает головой?'],
    help:['{まっすぐ=прямо}','{気(き)をつけている=старается, следит}','{正体(しょうたい)=кто он на самом деле}','{もしかして=неужели, а вдруг}','{〜に違(ちが)いない=наверняка ~}']},
   {sc:'k_bow',nx:1,ru:'«Спасибо за угощение». Посетитель положил деньги и поднялся. Я по привычке низко поклонился: «Спасибо вам!» И тут посетитель тоже невольно — раз — и поклонился…',

 roku:{ru:'Ночь в рёкане',
  title:'{旅館(りょかん)の=в рёкане (の)}{夜(よる)=ночь}',
  sc:{
  easy:[
   {sc:'r_room',ru:'Мы приехали в Киото на школьную поездку. Ночью все вместе спим в комнате рёкана. Подруга Мики сказала: «Слушайте, рассказать страшную историю?»',
    t:'{修学旅行(しゅうがくりょこう)で=на школьной поездке (で)|поездка всем классом с ночёвкой} {京都(きょうと)に=в Киото (に)} {来(き)ました=приехали}。\n{よるは=ночью (は)} {りょかんの=японской гостиницы (の)|りょかん: традиционная гостиница с татами} {へやで=в комнате (で)} {みんなで=все вместе} {ねます=спим}。\n{ともだちの=подруга} {ミキが=Мики (が)} {いいました=сказала}。「{ねえ=слушайте}、{こわい=страшную} {話(はなし)=историю}、{しようか=рассказать?|〜ようか: «может, сделать?»}」',
    q:'{ここは=здесь (тема)} {どこですか=где?}？',qr:'Где они?',
    o:['{がっこう=школа}','{りょかん=японская гостиница}','{びょういん=больница}'],a:1},
   {sc:'r_lore',ru:'«Знаете рокурокуби? Ночью, пока она спит, у неё вытягивается дли-инная шея. Но сама она совсем этого не знает, говорят». «Стра-ашно!» А учитель сказал: «Сладости нельзя!» — и положил шоколадки всех на полку наверху.',
    t:'「{ろくろくびって=рокурокуби — (って: «это…»)|って: разговорное «это / про»} {しってる=знаете?|しっている — разговорно}？」\n「{よる=ночью}、{ねている=пока спит} {あいだに=во время (に)|〜あいだに: «пока, за время»}、{くびが=шея} {ながーく=дли-инно} {のびるの=вытягивается|〜の: мягкое разговорное окончание}。{でも=но}、{本人(ほんにん)は=сама (тема)|ほんにん: сам человек} {ぜんぜん=совсем} {しらないんだって=не знает, говорят|〜んだって: «говорят, что»}。」\n「{こわーい=стра-ашно}！」\n{先生(せんせい)は=учитель (тема)} 「{おかしは=сладости (тема)} {だめ=нельзя}！」{と=— (цитата)} {いって=сказав}、{みんなの=всех (の)} {チョコを=шоколад (を)} {たなの=полки (の)} {上(うえ)に=наверх (に)} {おきました=положил}。',
    q:'{ろくろくびは=у рокурокуби} {いつ=когда} {くびが=шея} {のびますか=вытягивается?}？',qr:'Когда у рокурокуби вытягивается шея?',
    o:['{あさ=утром}','{ごはんの とき=во время еды}','{ねている とき=когда спит}'],a:2},
   {sc:'r_night',ru:'Посреди ночи я проснулась от шороха. Из футона Мики вытянулась длинная-длинная шея! Голова — наверху, у полки. Хрум-хрум — ест учительский шоколад.',
    t:'{よなか=посреди ночи}、{がさがさ=шурх-шурх|шорох}…… {という=такой} {音(おと)で=от звука (で — причина)} {目(め)が さめました=проснулась|めが さめる: проснуться}。\n{ミキの=Мики (の)} {ふとんから=из футона|ふとん: японский матрас и одеяло на полу}、{ながい=длинная} {ながい=длинная} {くびが=шея} {のびて います=вытянулась|〜ている: состояние}！\n{あたまは=голова} {たなの=полки} {上(うえ)=наверху}。{先生(せんせい)の=учителя (の)} {チョコを=шоколад} {ぱりぱり=хрум-хрум|хруст} {たべて います=ест}。',
    q:'{ミキの=Мики} {あたまは=голова} {何(なに)を=что} {していますか=делает?}？',qr:'Что делает голова Мики?',
    o:['{ねて います=спит}','{チョコを=шоколад} {たべて います=ест}','{うたを=песню} {うたって います=поёт}'],a:1},
   {sc:'r_morning',ru:'Утром Мики, зевая, сказала: «Видела странный сон. Будто летаю по небу и ем шоколад». Учитель ищет: «А? Шоколада нет!» А я… ничего не сказала.',
    t:'{あさ=утром}、{ミキは=Мики} {あくびを=зевок} {しながら=делая|〜ながら: «одновременно»} {いいました=сказала}。\n「{へんな=странный} {ゆめを=сон} {見(み)たよ=видела}。{空(そら)を=по небу} {とんで=летаю и}、{チョコを=шоколад} {たべる=ем} {ゆめ=сон}。」\n{先生(せんせい)は=учитель} 「{あれ=а?}？{チョコが=шоколада} {ない=нет}！」{と=—} {さがして います=ищет}。\n{わたしは=я}…… {何(なに)も=ничего} {いいませんでした=не сказала}。',
    q:'{ミキは=Мики} {どんな=какой} {ゆめを=сон} {見(み)ましたか=видела?}？',qr:'Какой сон видела Мики?',
    o:['{チョコを=шоколад} {たべる=ест} {ゆめ=сон}','{テストの=про контрольную} {ゆめ=сон}','{いぬと=с собакой} {あそぶ=играет} {ゆめ=сон}'],a:0},
   {sc:'r_wait',nx:1,ru:'Следующая ночь. Я не могу уснуть. Закрыла глаза и притворилась спящей. …Шурх-шурх. Снова тот звук. Звук всё ближе. Я тихонько открыла глаза. И тут…',
    t:'{つぎの=следующая} {よる=ночь}。{わたしは=я} {ねむれません=не могу уснуть|ねむれる: мочь уснуть}。\n{目(め)を=глаза} {とじて=закрыв}、{ねた ふりを=вид, что сплю|〜ふりを する: притворяться} {しました=сделала}。\n……{がさがさ=шурх-шурх}。{また=снова} {あの=тот самый} {音(おと)です=звук}。\n{音(おと)は=звук} {だんだん=постепенно} {ちかく なります=приближается|ちかい → ちかく なる: становиться ближе}。{わたしは=я} {そっと=тихонько} {目(め)を=глаза} {あけました=открыла}。{すると=и тут}……',
    q:'{つぎは=дальше} {どう なると=что будет — (как)} {おもいますか=думаете?}？',qr:'Как думаешь, что будет дальше?',
    o:['{ミキは=Мики} {ふつうに=обычно} {ねて いる=спит}','{目(め)の まえに=прямо перед глазами} {ミキの=Мики} {かおが ある=лицо}','{先生(せんせい)が=учитель} {チョコを=шоколад} {たべて いる=ест}'],a:1},
   {sc:'r_face',fx:'face',ru:'Прямо перед моими глазами было лицо Мики. Длинная шея тянулась через всю комнату, от края до края. Мики широко улыбнулась и тихо сказала: «…Ты ведь видела?»',
    t:'{目(め)の まえに=прямо перед глазами}、{ミキの=Мики} {かおが=лицо} {ありました=было}。\n{ながい=длинная} {くびが=шея} {へやの=комнаты} {はしから=от края} {はしまで=до края} {のびて います=тянется}。\n{ミキは=Мики} {にっこり=широко|にっこり: улыбка} {わらって=улыбнувшись}、{小(ちい)さい=тихим} {こえで=голосом} {いいました=сказала}。\n「……{見(み)たでしょ=ты ведь видела?|〜でしょ: «ведь так?» (разг.)}？」',
    q:'{ミキは=Мики} {よるの ことを=о том, что было ночью} {しって いましたか=знала?}？',qr:'Знала ли Мики о том, что было ночью?',
    o:['{いいえ=нет}、{しりませんでした=не знала}','{わかりません=неизвестно}','{はい=да}、{しって いました=знала}'],a:2}
  ],
  hard:[
   {sc:'r_room',ru:'На школьной поездке в средней школе мы остановились в старом рёкане в Киото. Наша комната — в самом конце коридора. Мы расстелили футоны на татами, выключили свет, и Мики из нашей группы, подсвечивая лицо снизу фонариком смартфона, сказала: «Слушайте, рассказать вам страшную историю?»',
    t:'{中学(ちゅうがく)の=средней школы}{修学旅行(しゅうがくりょこう)で=на школьной поездке|поездка всем классом с ночёвкой}、{京都(きょうと)の=в Киото}{古(ふる)い=старом}{旅館(りょかん)に=в рёкане|японская гостиница с татами}{泊(と)まった=остановились}。{わたしたちの=наша}{部屋(へや)は=комната}{廊下(ろうか)の=коридора}{いちばん=самый}{奥(おく)=дальний конец}。\n{畳(たたみ)に=на татами}{布団(ふとん)を=футоны}{並(なら)べて=расстелили рядом и}{電気(でんき)を=свет}{消(け)すと=как только погасили|〜と: «когда… — тут»}、{同(おな)じ=той же}{班(はん)の=группы|はん: маленькая группа внутри класса}{ミキが=Мики}{スマホの=смартфона}{ライトを=фонарик}{あごの下(した)から=снизу, из-под подбородка}{当(あ)てて=направив}{言(い)った=сказала}。\n「{ねえ=слушайте}、{怖(こわ)い話(はなし)=страшную историю}、{してあげよっか=рассказать вам?|〜てあげる: сделать для кого-то; 〜よっか: «может, …?»}。」',
    q:['{どこに=где}{泊(と)まりましたか=остановились?}？{どんな=какой}{部屋(へや)でしたか=была комната?}？','{あなたは=вы}{旅行(りょこう)や=в поездке или}{キャンプで=в лагере}{怖(こわ)い話(はなし)を=страшные истории}{したことが=рассказывали — опыт|〜たことがある: «доводилось»}{ありますか=есть?}？'],
    qr:['Где они остановились? Какая была комната?','Тебе случалось рассказывать страшилки в поездке или в лагере?'],
    help:['{旅館(りょかん)=рёкан}','{廊下(ろうか)の奥(おく)=в конце коридора}','{懐中電灯(かいちゅうでんとう)=фонарик}','{盛(も)り上(あ)がる=веселиться, оживляться}','{〜たことがある=доводилось ~}']},
   {sc:'r_lore',ru:'«Знаете рокурокуби? Это ёкай, у которого ночью, пока он спит, вытягивается одна только шея — вжу-ух. Голова бродит по комнате, а к утру всё как положено возвращается на место. А страшно вот что: сам человек ничего не помнит. Может быть, и среди нас…» Все закричали «Перестань!» и натянули футоны на головы. А коробка шоколада, которую учитель отобрал со словами «Конфискую!», лежала наверху на шкафу.',

   {sc:'r_night',ru:'Посреди ночи я проснулась от шороха. У тёмного потолка что-то шевелится. …Голова. Из футона Мики плавно вытянулась белая шея, а голова оказалась наверху у шкафа. Хрусть, хрусть — голова с аппетитом ела учительский шоколад. Я задержала дыхание и закрыла глаза.',

   {sc:'r_morning',ru:'Утром Мики, зевая, сказала: «Такой странный сон видела. Лечу по небу и ем шоколад». В коридоре учитель в недоумении склонил голову набок: «Странно, шоколад пропал…» Может, сказать учителю? Но как это сказать? В итоге я решила промолчать.',

   {sc:'r_wait',nx:1,ru:'Следующая ночь. Я никак не могла уснуть. Закрываю глаза, притворяюсь спящей. Сонное дыхание остальных. Тиканье часов. И вот — шурх, шурх. Тот самый звук. Звук понемногу приближается и останавливается совсем рядом с моей подушкой. Тихонько открываю глаза — и…',

  const A=L==='a'?[[-40,-16,250,36],[150,8,110,20],[440,252,250,40],[350,268,120,22]]:L==='b'?[[440,-16,250,36],[390,8,110,20],[-40,252,250,40],[170,268,120,22]]:[[-40,-16,200,32],[480,-16,200,32],[-40,256,200,36],[480,256,200,36]];
  return `<g class="kas">${A.map(a=>b(...a)).join('')}</g>`}

  for(let i=1;i<w/34;i++)s+=`<line x1="${x+i*34}" y1="${y}" x2="${x+i*34}" y2="${y+h}" stroke="${line}" stroke-width="2"/>`;
  for(let j=1;j<h/40;j++)s+=`<line x1="${x}" y1="${y+j*40}" x2="${x+w}" y2="${y+j*40}" stroke="${line}" stroke-width="2"/>`;
  for(let i=0;i<=w;i+=w/ Math.max(1,Math.round(w/136)))s+=`<line x1="${x+i}" y1="${y}" x2="${x+i}" y2="${y+h}" stroke="${EK}" stroke-width="5"/>`;
  return s+`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="${EK}" stroke-width="4"/>`}
function tatami(y,c1,c2){let s=`<rect y="${y}" width="640" height="${280-y}" fill="${c1}"/>`;for(let i=0;i<8;i++)s+=`<path d="M${-200+i*130} 280L${40+i*80} ${y}" stroke="${c2}" stroke-width="5"/>`;return s+`<path d="M0 ${y+50}H640" stroke="${c2}" stroke-width="5"/><path d="M0 ${y}H640" stroke="${EK}" stroke-width="2"/>`}

function pillow(x,y){return `<rect x="${x-36}" y="${y-12}" width="72" height="26" rx="12" fill="#f6f1e6" stroke="${EK}" stroke-width="2"/>`}

const svWeb=(()=>{try{return /^https?:/.test(location.protocol)&&window.top===window.self}catch(e){return false}})();
function svSum(st,lv){const S=new Set(st);
  return ['1','2','3','4','5'].map(id=>`<i class="${S.has(id)?'on':''}">${ICON[id]}</i>`).join('')+`<b>${lv==='hard'?'<ruby>中級<rt>ちゅうきゅう</rt></ruby>':'<ruby>初級<rt>しょきゅう</rt></ruby>'}</b>`}
function svMsg(t,bad){const m=SV.querySelector('.sv-msg');m.innerHTML=t?jp(t):'';m.classList.toggle('bad',!!bad)}
function svOpen(inc){hidePop();hideTip();svIncoming=inc||null;
  SV.querySelector('.sv-lead').innerHTML=jp(inc?'{セーブデータが=сохранение (が)} {とどきました=пришло|とどく: доходить, приходить}！':'{リンクを=ссылку (を)} {おくると=если отправить|〜と: «если / когда»}、{つづきから=с того же места} {あそべます=можно играть|あそぶ → あそべる: «можно играть»}');
  SV.querySelector('.sv-sum').innerHTML=inc?svSum(inc.s,inc.l):svSum([...stamps],level);
  SV.querySelector('.sv-hint').textContent=inc?'По ссылке пришёл прогресс: печати выше. «よみこむ» заменит текущий прогресс на этом устройстве.':'«コピー» копирует ссылку с печатями, прогрессом комнат и созданным ёкаем — отправьте её ученику. «よみこむ» — вставить присланную ссылку или код.';
  SV.querySelector('.sv-main').hidden=!!inc;SV.querySelector('.sv-take').hidden=!inc;SV.querySelector('.sv-in').hidden=true;
  $('#svCode').value='';svMsg('');SV.hidden=false}
function svClose(){SV.hidden=true;svIncoming=null}
function svApply(o){store.set('obake-level',o.l==='hard'?'hard':'easy');store.set('obake-stamps',o.s.map(String));store.set('obake-prog',o.p);
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}SFX.stamp();setTimeout(()=>location.reload(),350)}
async function svCopy(){const code=await svEnc({v:1,l:level,s:[...stamps],p:prog});
  const text=svWeb?location.origin+location.pathname+'#s='+code:code;
  let ok=false;try{await navigator.clipboard.writeText(text);ok=true}catch(e){}
  if(!ok){const inp=$('#svCode');SV.querySelector('.sv-in').hidden=false;inp.value=text;inp.focus();inp.select();try{ok=document.execCommand('copy')}catch(e){}}
  SFX.ting();svMsg(ok?'{コピーしました=скопировано}！':'{コピーして=скопируй} {ください=пожалуйста}',!ok)}
SV.addEventListener('click',async e=>{const b=e.target.closest('[data-sv]');if(!b){if(e.target===SV)svClose();return}const a=b.dataset.sv;
  if(a==='x')svClose();
  else if(a==='copy')svCopy();
  else if(a==='load'){SV.querySelector('.sv-in').hidden=false;const inp=$('#svCode');inp.value='';inp.focus();svMsg('');
    try{const t=await navigator.clipboard.readText();if(/s=|^[zj][A-Za-z0-9_-]{20,}$/.test((t||'').trim()))inp.value=t.trim()}catch(e){}}
  else if(a==='ok'){try{svApply(await svDec($('#svCode').value))}catch(err){SFX.low();svMsg('{コードが=код (が)} {ちがいます=неверный|ちがう: отличаться, быть не тем}',true)}}
  else if(a==='take'&&svIncoming)svApply(svIncoming)});
$('#svCode').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();SV.querySelector('[data-sv=ok]').click()}});
$('#saveBtn').addEventListener('click',e=>{e.stopPropagation();svOpen()});
(async()=>{if(!/[#&]s=/.test(location.hash))return;try{const o=await svDec(location.hash);svOpen(o)}catch(e){}
  try{history.replaceState(history.state,'',location.pathname+location.search)}catch(e){}})();

/* ===== back gesture / back button: one history guard entry; back closes the topmost layer ===== */
let bkArm=0,bkT=null;
function bkPush(){try{if(!(history.state&&history.state.obake))history.pushState({obake:1},'')}catch(e){}}
function bkBack(){
  if(!pop.hidden){hidePop();return true}
  if(!SV.hidden){svClose();return true}
  if(!GSB.hidden){gsClose();return true}
  const ib=$('#inst');if(ib&&!ib.hidden){ib.hidden=true;return true}
  if(hkOn){if(hkBub)hkUnsay();else hkClose();return true}
  if(curMode){if(GAMES[curMode]==='story'&&st4().s){const lb=$('#mBody [data-g="lib"]');if(lb){lb.click();return true}}closeMode();return true}
  return false}
addEventListener('popstate',()=>{
  if(bkBack()){clearTimeout(bkT);bkArm=0;bkPush();return}
  if(!started||bkArm)return;
  bkArm=1;clearToasts();eggRect=null;SFX.ting();
  toast(innerWidth/2,innerHeight*.55,'{もう いちど=ещё раз} {もどると=если вернуться назад|〜と: «если / когда»}、{ゲームが=игра (が)} {おわります=закончится|Ещё один жест «назад» — выход из игры}');
  clearTimeout(bkT);bkT=setTimeout(()=>{bkArm=0;bkPush()},3000)});

/* ===== boot ===== */
document.body.insertAdjacentHTML('beforeend',`<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>${Y5DEFS}</defs></svg>`);
document.body.insertAdjacentHTML('afterbegin',YDEFS);
gen();halos();buildUI();renderJP();wireHover();
setLevel(level);setHints(hints);setSound(soundOn);renderStamps();
layout();addEventListener('resize',layout);
checkRuby();
})();
</script>

</body></html>
